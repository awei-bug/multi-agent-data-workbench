name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: 运行后端测试
        run: |
          $env:PYTHONPATH = "backend"
          python -m pytest backend/tests/test_config.py backend/tests/test_migrations.py backend/tests/test_workspace_api.py backend/tests/test_workflow_service.py backend/tests/test_document_analysis_path.py backend/tests/test_auth.py backend/tests/test_rbac.py backend/tests/test_async_workflow.py backend/tests/test_relational_scope.py backend/tests/test_observability.py backend/tests/test_redis_queue.py backend/tests/test_error_tracking.py backend/tests/test_rate_limit.py backend/tests/test_connectors.py
        shell: pwsh

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 运行前端单测
        run: npm test -- --reporter=dot
      - name: 构建前端
        run: npm run build
      - name: 运行前端 E2E
        run: npm run test:e2e

  compose-validate:
    name: Compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 docker compose
        run: docker compose config
