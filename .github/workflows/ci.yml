name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pip-audit
      - name: 依赖漏洞扫描
        run: python -m pip_audit -r backend/requirements.txt || true
      - name: 运行后端测试
        run: |
          $env:PYTHONPATH = "backend"
          python -m pytest backend/tests -q
        shell: pwsh

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 运行前端单测
        run: npm test -- --reporter=dot
      - name: 构建前端
        run: npm run build
      - name: 运行前端 E2E
        run: npm run test:e2e

  security-scan:
    name: 密钥与配置扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 基础密钥模式扫描
        shell: bash
        run: |
          set -euo pipefail
          if rg -n --hidden --glob '!.git/**' --glob '!node_modules/**' --glob '!.venv/**' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e '-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' \
            -e 'api[_-]?key["\s:=]+[A-Za-z0-9_\-]{20,}' \
            .; then
            echo "Potential secrets detected" >&2
            exit 1
          fi
          echo "No obvious secrets matched basic patterns."

  compose-validate:
    name: Compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 docker compose
        run: docker compose config
      - name: 校验 production compose 语法
        run: |
          export POSTGRES_PASSWORD=dummy
          export WORKSPACE_AUTH_SECRET=dummy-auth-secret-24chars-min
          export WORKSPACE_ADMIN_API_KEY=dummy-admin-key-16
          export WORKSPACE_CREDENTIALS_SECRET=dummy-credentials-secret-24
          export WORKSPACE_CORS_ORIGINS=https://example.com
          export WORKSPACE_REDIS_PASSWORD=dummy-redis-password
          docker compose -f docker-compose.production.yml config >/dev/null
