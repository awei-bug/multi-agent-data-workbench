services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: workbench
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workbench"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APIHUB_API_KEY: ${APIHUB_API_KEY:-}
      WORKSPACE_API_HOST: 0.0.0.0
      WORKSPACE_API_PORT: 8787
      WORKSPACE_DATABASE_URL: postgresql://postgres:123456@postgres:5432/workbench
      WORKSPACE_MODEL_TIMEOUT_SECONDS: ${WORKSPACE_MODEL_TIMEOUT_SECONDS:-60}
      WORKSPACE_ENABLE_AUDIT_EVENTS: ${WORKSPACE_ENABLE_AUDIT_EVENTS:-true}
      WORKSPACE_CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      args:
        VITE_WORKSPACE_API_BASE_URL: http://127.0.0.1:8787
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
